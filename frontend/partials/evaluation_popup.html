<style>
  .evaluation-popup {
    position: fixed;
    top: 5rem;
    left: calc(100vw - 31rem);
    z-index: 80;
    width: min(28rem, calc(100vw - 1.5rem));
    max-height: calc(100vh - 2rem);
    overflow: hidden;
    border: 1px solid #e8dfce;
    border-radius: 1rem;
    background: #ffffff;
    box-shadow: 0 24px 70px rgba(15, 23, 42, 0.22);
  }

  .evaluation-popup.hidden { display: none; }

  .evaluation-popup-header {
    cursor: move;
    user-select: none;
    background: #111827;
    color: #ffffff;
  }

  .evaluation-popup-body {
    max-height: calc(100vh - 9rem);
    overflow: auto;
  }

  .evaluation-scale {
    display: grid;
    grid-template-columns: repeat(5, minmax(0, 1fr));
    gap: 0.35rem;
  }

  .evaluation-scale input { position: absolute; opacity: 0; pointer-events: none; }

  .evaluation-scale span {
    display: grid;
    place-items: center;
    height: 2rem;
    border: 1px solid #e5e7eb;
    border-radius: 0.5rem;
    color: #6b7280;
    font-size: 0.78rem;
    font-weight: 900;
    transition: all 0.15s ease;
  }

  .evaluation-scale input:checked + span {
    border-color: #f59e0b;
    background: #f59e0b;
    color: #ffffff;
  }
</style>

<div id="evaluationPopup" class="evaluation-popup hidden" role="dialog" aria-modal="false" aria-labelledby="evaluationPopupTitle">
  <div id="evaluationPopupHandle" class="evaluation-popup-header flex items-center justify-between px-4 py-3">
    <div>
      <p class="text-[10px] font-black uppercase tracking-[0.18em] text-white/60">Floating Evaluation</p>
      <h2 id="evaluationPopupTitle" class="text-sm font-black">Applicant Evaluation</h2>
    </div>
    <button type="button" id="closeEvaluationPopup" class="grid h-8 w-8 place-items-center rounded-lg bg-white/10 text-white hover:bg-white/20" aria-label="Close evaluation popup">x</button>
  </div>

  <form id="evaluationPopupForm" method="POST" action="/save-evaluation/" class="evaluation-popup-body p-4 space-y-4">
    {% csrf_token %}
    <input type="hidden" name="applicant_identifier" id="popupApplicantId">
    <input type="hidden" name="evaluation_type" id="popupEvaluationType" value="demo">
    <input type="hidden" name="redirect_to" value="{{ request.path }}">

    <div class="rounded-xl border border-gray-100 bg-gray-50 px-3 py-2">
      <p class="text-[10px] font-black uppercase tracking-widest text-gray-400">Applicant</p>
      <p id="popupApplicantName" class="text-sm font-black text-gray-900">-</p>
    </div>

    <div id="popupDemoFields" class="space-y-3">
      <div class="grid gap-3">
        <div>
          <label class="mb-1 block text-xs font-black uppercase text-gray-500">Teaching Performance</label>
          <div class="evaluation-scale" data-rating-group="teaching_performance_rating"></div>
        </div>
        <div>
          <label class="mb-1 block text-xs font-black uppercase text-gray-500">Communication Skills</label>
          <div class="evaluation-scale" data-rating-group="communication_skills_rating"></div>
        </div>
        <div>
          <label class="mb-1 block text-xs font-black uppercase text-gray-500">Curriculum Understanding</label>
          <div class="evaluation-scale" data-rating-group="curriculum_understanding_rating"></div>
        </div>
        <div>
          <label class="mb-1 block text-xs font-black uppercase text-gray-500">Engagement Level</label>
          <div class="evaluation-scale" data-rating-group="engagement_level_rating"></div>
        </div>
        <div>
          <label class="mb-1 block text-xs font-black uppercase text-gray-500">Technical Proficiency</label>
          <div class="evaluation-scale" data-rating-group="technical_proficiency_rating"></div>
        </div>
      </div>
    </div>

    <div id="popupClientFields" class="hidden rounded-xl border border-indigo-100 bg-indigo-50/70 p-3">
      <label class="mb-2 block text-xs font-black uppercase text-indigo-700">Client Decision</label>
      <div class="grid grid-cols-2 gap-2">
        <label class="cursor-pointer rounded-lg border border-green-200 bg-white p-3 text-sm font-black text-green-700">
          <input type="radio" name="client_decision" value="Pass" class="mr-2">Pass
        </label>
        <label class="cursor-pointer rounded-lg border border-red-200 bg-white p-3 text-sm font-black text-red-700">
          <input type="radio" name="client_decision" value="Fail" class="mr-2">Fail
        </label>
      </div>
    </div>

    <div>
      <label for="popupComments" class="mb-1 block text-xs font-black uppercase text-gray-500">Comments</label>
      <textarea id="popupComments" name="overall_comments" rows="5" class="w-full rounded-xl border border-gray-200 px-3 py-2 text-sm focus:border-amber-400 focus:outline-none focus:ring-2 focus:ring-amber-100" placeholder="Write notes, recommendations, or client feedback..."></textarea>
    </div>

    <div class="flex items-center justify-between gap-3 border-t border-gray-100 pt-3">
      <button type="button" id="resetEvaluationPopup" class="rounded-lg bg-gray-100 px-4 py-2 text-xs font-black text-gray-600 hover:bg-gray-200">Clear</button>
      <button type="submit" class="rounded-lg bg-gray-900 px-5 py-2 text-xs font-black text-white hover:bg-black">Save Evaluation</button>
    </div>
  </form>
</div>

<script>
  (() => {
    const popup = document.getElementById('evaluationPopup');
    if (!popup) return;

    const handle = document.getElementById('evaluationPopupHandle');
    const form = document.getElementById('evaluationPopupForm');
    const applicantId = document.getElementById('popupApplicantId');
    const evaluationType = document.getElementById('popupEvaluationType');
    const applicantName = document.getElementById('popupApplicantName');
    const comments = document.getElementById('popupComments');
    const demoFields = document.getElementById('popupDemoFields');
    const clientFields = document.getElementById('popupClientFields');

    const ratingKeys = [
      'teaching_performance_rating',
      'communication_skills_rating',
      'curriculum_understanding_rating',
      'engagement_level_rating',
      'technical_proficiency_rating'
    ];

    document.querySelectorAll('[data-rating-group]').forEach(group => {
      const name = group.dataset.ratingGroup;
      for (let value = 1; value <= 5; value += 1) {
        const label = document.createElement('label');
        label.className = 'cursor-pointer';
        label.innerHTML = `<input type="radio" name="${name}" value="${value}"><span>${value}</span>`;
        group.appendChild(label);
      }
    });

    function setDemoEnabled(enabled) {
      ratingKeys.forEach(name => {
        form.querySelectorAll(`input[name="${name}"]`).forEach(input => {
          input.disabled = !enabled;
          input.required = enabled;
        });
      });
    }

    function setClientEnabled(enabled) {
      form.querySelectorAll('input[name="client_decision"]').forEach(input => {
        input.disabled = !enabled;
        input.required = enabled;
      });
    }

    function setRating(name, value) {
      form.querySelectorAll(`input[name="${name}"]`).forEach(input => {
        input.checked = input.value === String(value || '');
      });
    }

    function openEvaluationPopup(button) {
      const type = button.dataset.evalType || 'demo';
      applicantId.value = button.dataset.applicantId || '';
      evaluationType.value = type;
      applicantName.textContent = button.dataset.applicantName || 'Applicant';
      comments.value = button.dataset.comments || '';

      const isClient = type === 'client';
      demoFields.classList.toggle('hidden', isClient);
      clientFields.classList.toggle('hidden', !isClient);
      setDemoEnabled(!isClient);
      setClientEnabled(isClient);

      if (isClient) {
        form.querySelectorAll('input[name="client_decision"]').forEach(input => {
          input.checked = input.value === button.dataset.clientDecision;
        });
      } else {
        setRating('teaching_performance_rating', button.dataset.teachingPerformance);
        setRating('communication_skills_rating', button.dataset.communicationSkills);
        setRating('curriculum_understanding_rating', button.dataset.curriculumUnderstanding);
        setRating('engagement_level_rating', button.dataset.engagementLevel);
        setRating('technical_proficiency_rating', button.dataset.technicalProficiency);
      }

      popup.classList.remove('hidden');
      popup.style.top = popup.style.top || '5rem';
      popup.style.left = popup.style.left || `calc(100vw - ${popup.offsetWidth + 24}px)`;
    }

    document.querySelectorAll('.evaluation-popup-trigger').forEach(button => {
      button.addEventListener('click', () => openEvaluationPopup(button));
    });

    document.getElementById('closeEvaluationPopup').addEventListener('click', () => popup.classList.add('hidden'));
    document.getElementById('resetEvaluationPopup').addEventListener('click', () => {
      form.querySelectorAll('input[type="radio"]').forEach(input => { input.checked = false; });
      comments.value = '';
    });

    let drag = null;
    handle.addEventListener('pointerdown', event => {
      if (event.target.closest('button')) return;
      drag = {
        pointerId: event.pointerId,
        startX: event.clientX,
        startY: event.clientY,
        left: popup.offsetLeft,
        top: popup.offsetTop
      };
      handle.setPointerCapture(event.pointerId);
    });

    handle.addEventListener('pointermove', event => {
      if (!drag) return;
      const nextLeft = Math.min(Math.max(8, drag.left + event.clientX - drag.startX), window.innerWidth - popup.offsetWidth - 8);
      const nextTop = Math.min(Math.max(8, drag.top + event.clientY - drag.startY), window.innerHeight - 80);
      popup.style.left = `${nextLeft}px`;
      popup.style.top = `${nextTop}px`;
    });

    handle.addEventListener('pointerup', () => { drag = null; });
    handle.addEventListener('pointercancel', () => { drag = null; });
  })();
</script>
